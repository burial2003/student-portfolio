<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Club</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <header>
        <h1>Join a Student Club</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="clubs.html">Clubs</a>
            <a href="events.html">Events</a>
            <a href="join.html">Join</a>
            <a href="highlights.html">Highlights</a>
        </nav>
    </header>

    <main>
        <h2>Become a Member</h2>
        <p>Fill out the form below to join one of our student clubs.</p>

        <form>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required>

            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="club">Choose a Club:</label><br>
            <select id="club" name="club">
                <option value="technology">Technology Club</option>
                <option value="sports">Sports Club</option>
                <option value="arts">Arts Club</option>
            </select>

            <br><br>

            <label for="reason">Why would you like to join?</label><br>
            <textarea id="reason" name="reason" rows="4"></textarea>

            <br><br>

            <button type="submit">Submit</button>
        </form>
    </main>
</body>
